<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title -->
  <title>Wrist Fellow – Premium Watches, Style & Accessories</title>

  <!-- Meta Description -->
  <meta name="description" content="Wrist Fellow offers premium wristwatches, stylish accessories, and timeless designs. Explore our collection and stay connected with us online.">

  <!-- Meta Keywords -->
  <meta name="keywords" content="wrist fellow, watches, premium watches, luxury watches, accessories, fashion, style, wrist accessories">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://wristfellow.com/">

  <!-- Open Graph for Social Sharing -->
  <meta property="og:title" content="Wrist Fellow – Premium Watches & Accessories">
  <meta property="og:description" content="Discover premium wristwatches and stylish accessories with Wrist Fellow.">
  <meta property="og:image" content="https://wristfellow.com/azam_logo_2.png">
  <meta property="og:url" content="https://wristfellow.com/">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Wrist Fellow – Premium Watches & Accessories">
  <meta name="twitter:description" content="Discover premium wristwatches and stylish accessories with Wrist Fellow.">
  <meta name="twitter:image" content="https://wristfellow.com/azam_logo_2.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at top left, #0f172a, #020617);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }
    .logo {
      width: 90px;
      height: 90px;
    }
    h1.title {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .contact {
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 1rem;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon {
      width: 20px;
      height: 20px;
    }
    .loading {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: #ccc;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top: 3px solid #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .retry-btn {
      margin-top: 10px;
      padding: 6px 12px;
      background: #facc15;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .retry-btn:hover {
      background: #eab308;
    }
  </style>
</head>
<body>
  <!-- Logo -->
  <img src="azam_logo_2.png" alt="Wrist Fellow brand logo" class="logo" loading="lazy" />

  <!-- Title -->
  <h1 class="title">Wrist Fellow</h1>
  <p>Your destination for premium wristwatches and stylish accessories.</p>

  <!-- Contact Info -->
  <div class="contact">
    <div class="contact-item">
      <img src="https://img.icons8.com/ios-filled/50/ffffff/internet.png" class="icon" alt="Website Icon">
      <span>WRISTFELLOW.COM</span>
    </div>
    <div class="contact-item">
      <img src="https://img.icons8.com/ios-filled/50/ffffff/instagram-new.png" class="icon" alt="Instagram Icon">
      <span>@WRISTFELLOW1</span>
    </div>
    <div class="contact-item">
      <img src="https://img.icons8.com/ios-filled/50/ffffff/whatsapp.png" class="icon" alt="WhatsApp Icon">
      <span>9574647871</span>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading">
    <span>Loading...</span>
    <div class="spinner"></div>
  </div>

  <script>
    let redirected = false;

    function redirectNow() {
      redirected = true;
      window.location.href = "https://wristfellow1.cartpe.in/";
    }

    setTimeout(redirectNow, 500);

    setTimeout(function() {
      if (!redirected) {
        document.querySelector(".loading").innerHTML = `
          <span>Connection seems slow.</span>
          <button class="retry-btn" onclick="redirectNow()">Retry</button>
        `;
      }
    }, 8000);
  </script>
</body>
</html>
