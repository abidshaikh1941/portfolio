<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wrist Fellow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at top left, #0f172a, #020617);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    /* Logo */
    .logo {
      width: 90px;
      height: 90px;
    }

    /* Title */
    .title {
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Contact section */
    .contact {
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 1rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon {
      width: 20px;
      height: 20px;
    }

    /* Loading spinner */
    .loading {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: #ccc;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top: 3px solid #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Retry button */
    .retry-btn {
      margin-top: 10px;
      padding: 6px 12px;
      background: #facc15;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .retry-btn:hover {
      background: #eab308;
    }
  </style>
</head>
<body>
  <!-- Logo -->
  <img src="azam_logo_2.png" alt="Wrist Fellow Logo" class="logo" />

  <!-- Title -->
  <div class="title">WRIST FELLOW</div>

  <!-- Contact Info -->
  <div class="contact">
    <div class="contact-item">
      <img src="https://img.icons8.com/ios-filled/50/ffffff/internet.png" class="icon" alt="Website">
      <span>WRISTFELLOW.COM</span>
    </div>
    <div class="contact-item">
      <img src="https://img.icons8.com/ios-filled/50/ffffff/instagram-new.png" class="icon" alt="Instagram">
      <span>@WRISTFELLOW1</span>
    </div>
    <div class="contact-item">
      <img src="https://img.icons8.com/ios-filled/50/ffffff/whatsapp.png" class="icon" alt="WhatsApp">
      <span>9574647871</span>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading">
    <span>Loading...</span>
    <div class="spinner"></div>
  </div>

  <script>
    let redirected = false;

    function redirectNow() {
      redirected = true;
      window.location.href = "https://wristfellow1.cartpe.in/";
    }

    // Redirect after 1 second
    setTimeout(redirectNow, 500);

    // If still not redirected after 8 seconds, show retry option
    setTimeout(function() {
      if (!redirected) {
        document.querySelector(".loading").innerHTML = `
          <span>Connection seems slow.</span>
          <button class="retry-btn" onclick="redirectNow()">Retry</button>
        `;
      }
    }, 8000);
  </script>
</body>
</html>
